# 작업마다 같은 준비: pnpm·Node 설치(pnpm 저장소 캐시), 의존성 설치, Turborepo 로컬 캐시 되살리기.
# Turborepo 원격 캐시는 쓰지 않고 GitHub Actions 캐시에 .turbo/cache를 둔다.
name: 준비
description: pnpm·Node·의존성과 Turborepo 캐시
inputs:
  turbo-key:
    description: 이 작업이 저장할 Turborepo 캐시 이름(build, static 등)
    required: true
runs:
  using: composite
  steps:
    # pnpm 버전은 package.json의 packageManager를 따른다.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # 같은 커밋의 캐시가 있으면 그대로(빌드 결과를 E2E·Lighthouse가 다시 씀), 없으면 가장 최근 캐시에서 이어 간다.
    - uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ inputs.turbo-key }}-
