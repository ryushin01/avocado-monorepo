# 의존성 업데이트 PR. 매주 묶어서 받고, 공개된 지 3일이 지난 버전만 올린다(공급망 공격 대비).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 도구용 TypeScript는 6.0에 둔다(docs/conventions.md). 타입 검사용 7은 typescript-7이다.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # eslint-config-next의 플러그인이 9까지만 지원한다(README).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
