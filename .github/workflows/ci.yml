# 완료 기준 다섯 가지(타입 검사·린트·단위 테스트·빌드·E2E)를 푸시·PR마다 실행한다.
# 단위 테스트는 커버리지를 함께 재서 7일간 보관한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage

      - name: 테스트 커버리지 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

      - run: pnpm build

      - name: Playwright 브라우저 설치
        run: pnpm --filter @avocado/admin exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: E2E 실패 기록 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/admin/test-results/
          retention-days: 7
